name: OpenNetty
description: OpenWebNet/MQTT gateway for BTicino and Legrand home automation devices
version: 1.0.1
slug: opennetty
url: https://github.com/IsraelBenDavid/opennetty-core
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
map:
  - config:rw
  - ssl:ro
uart: true
init: false
options:
  mqtt_server: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls_enabled: false
  mqtt_tls_ca_cert: ""
  mqtt_tls_client_cert: ""
  mqtt_tls_client_key: ""
  mqtt_tls_server_host: ""
  ha_discovery_culture: ""
  debug_logging: false
  gateways: []
schema:
  mqtt_server: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls_enabled: bool
  mqtt_tls_ca_cert: str?
  mqtt_tls_client_cert: str?
  mqtt_tls_client_key: str?
  mqtt_tls_server_host: str?
  ha_discovery_culture: str?
  debug_logging: bool
  gateways:
    - brand: list(Legrand|BTicino)
      model: str
      serial_number: str
      gateway_name: str
      gateway_type: list(Serial|Tcp)
      port: str?
      server: str?
      password: str?
hassio_api: false
